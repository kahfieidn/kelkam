name: Deploy Next.js to cPanel (FTP Standalone Only)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🚀 Apply Database Migrations (Opsional)
        if: env.DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          echo "Menjalankan migrasi database jika koneksi tersedia..."
          npx prisma migrate deploy --schema prisma/schema.prisma || echo "::warning::Migrasi dilewati atau gagal terhubung ke database."

      - name: 🏗️ Build Next.js (Standalone Mode)
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://keluhkampus.my.id' }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_MODEL_FAST: ${{ secrets.AI_MODEL_FAST }}
          AI_MODEL_REVIEW: ${{ secrets.AI_MODEL_REVIEW }}
        run: npm run build

      - name: 📁 Prepare Deployment Directory
        run: |
          echo "Menyiapkan direktori deploy..."
          rm -rf deploy
          mkdir -p deploy/.next/standalone/.next
          mkdir -p deploy/tmp

          # 1. Salin seluruh isi .next/standalone ke struktur deploy/.next/standalone
          cp -r .next/standalone/. deploy/.next/standalone/

          # 2. Salin .next/static ke .next/standalone/.next/static (Wajib untuk Next.js standalone)
          cp -r .next/static deploy/.next/standalone/.next/

          # 3. Salin folder public ke .next/standalone/public (Wajib untuk Next.js standalone)
          cp -r public deploy/.next/standalone/

          # 4. Trigger auto-restart cPanel (Phusion Passenger me-restart app jika tmp/restart.txt diubah)
          touch deploy/tmp/restart.txt

          # 5. Salin folder prisma untuk kebutuhan runtime skema jika ada
          if [ -d "prisma" ]; then
            cp -r prisma deploy/
          fi

          # 6. Buat file root server.js sebagai fallback cadangan
          cat << 'EOF' > deploy/server.js
          // Fallback loader jika cPanel startup file diset ke server.js
          require('./.next/standalone/server.js');
          EOF

          # 7. Generate file .env di server untuk runtime production
          cat << EOF > deploy/.env
          NODE_ENV=production
          PORT=3000
          HOSTNAME=0.0.0.0
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DIRECT_URL=${{ secrets.DIRECT_URL }}
          AUTH_JWT_SECRET=${{ secrets.AUTH_JWT_SECRET }}
          NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://keluhkampus.my.id' }}
          AI_API_KEY=${{ secrets.AI_API_KEY }}
          AI_BASE_URL=${{ secrets.AI_BASE_URL }}
          AI_MODEL=${{ secrets.AI_MODEL }}
          AI_MODEL_FAST=${{ secrets.AI_MODEL_FAST }}
          AI_MODEL_REVIEW=${{ secrets.AI_MODEL_REVIEW }}
          EOF

          echo "Isi folder deploy:"
          ls -la deploy
          echo "Isi folder deploy/.next/standalone:"
          ls -la deploy/.next/standalone

      - name: 📤 Deploy via FTP (lftp mirror - Fast & Parallel)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || '/' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          
          # Konfigurasi lftp:
          # - parallel 6: upload 6 file sekaligus (jauh lebih cepat daripada FTP biasa)
          # - delete: hapus file lama/chunk usang Next.js agar disk cPanel hemat
          # - ssl-allow yes & verify-certificate no: kompatibel dengan FTP biasa maupun FTPS self-signed cPanel
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 30
          mirror --reverse --delete --parallel=6 --verbose ./deploy/ "$FTP_SERVER_DIR"
          bye
          EOF

      - name: 🔔 Deploy Summary
        if: always()
        run: |
          echo "### 🚀 Deployment Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Startup File Target:** \`.next/standalone/server.js\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Passenger Auto-restart:** \`tmp/restart.txt\` updated" >> $GITHUB_STEP_SUMMARY
