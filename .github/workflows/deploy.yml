name: Deploy Next.js to cPanel 2
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy via FTP (Direct Mirror)
    runs-on: ubuntu-latest
    environment: FTP_SERVER

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🌐 Ambil Info IP Runner GitHub
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org || curl -s https://ifconfig.me)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          echo "=========================================================="
          echo "🌐 IP Runner GitHub Actions saat ini: $RUNNER_IP"
          echo "Command Whitelist di server CSF: csf -a $RUNNER_IP GitHub-Actions"
          echo "=========================================================="
          echo "### 🌐 GitHub Runner IP: \`$RUNNER_IP\`" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 Jika firewall memblokir, jalankan di server: \`csf -a $RUNNER_IP GitHub-Actions\`" >> $GITHUB_STEP_SUMMARY

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🚀 Apply Database Migrations (Opsional)
        if: env.DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          echo "Menjalankan migrasi database jika koneksi tersedia..."
          npx prisma migrate deploy --schema prisma/schema.prisma || echo "::warning::Migrasi dilewati atau gagal terhubung ke database."

      - name: 🏗️ Build Next.js (Standalone Mode)
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://keluhkampus.my.id' }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_MODEL_FAST: ${{ secrets.AI_MODEL_FAST }}
          AI_MODEL_REVIEW: ${{ secrets.AI_MODEL_REVIEW }}
        run: npm run build

      - name: 📁 Prepare Deploy Folder
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Menyiapkan folder deploy lokal (siap di-mirror ke FTP)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          rm -rf deploy
          mkdir -p deploy/.next/standalone/.next
          mkdir -p deploy/tmp

          echo "→ Menyalin .next/standalone..."
          cp -r .next/standalone/. deploy/.next/standalone/

          echo "→ Menyalin .next/static..."
          cp -r .next/static deploy/.next/standalone/.next/

          echo "→ Menyalin public/..."
          cp -r public deploy/.next/standalone/

          # Touch tmp/restart.txt agar Phusion Passenger restart saat file ini diperbarui
          touch deploy/tmp/restart.txt

          if [ -d "prisma" ]; then
            echo "→ Menyalin prisma/..."
            cp -r prisma deploy/
          fi

          # Buat server.js startup loader untuk cPanel
          printf '// Startup file: cPanel Node.js App Startup File = server.js\nrequire("./.next/standalone/server.js");\n' > deploy/server.js

          # Generate .env runtime production
          printf 'NODE_ENV=production\nPORT=3000\nHOSTNAME=0.0.0.0\n' > deploy/.env
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL_VAL" >> deploy/.env
          printf 'DIRECT_URL=%s\n' "$DIRECT_URL_VAL" >> deploy/.env
          printf 'AUTH_JWT_SECRET=%s\n' "$AUTH_JWT_SECRET_VAL" >> deploy/.env
          printf 'NEXT_PUBLIC_SITE_URL=%s\n' "$SITE_URL_VAL" >> deploy/.env
          printf 'AI_API_KEY=%s\n' "$AI_API_KEY_VAL" >> deploy/.env
          printf 'AI_BASE_URL=%s\n' "$AI_BASE_URL_VAL" >> deploy/.env
          printf 'AI_MODEL=%s\n' "$AI_MODEL_VAL" >> deploy/.env
          printf 'AI_MODEL_FAST=%s\n' "$AI_MODEL_FAST_VAL" >> deploy/.env
          printf 'AI_MODEL_REVIEW=%s\n' "$AI_MODEL_REVIEW_VAL" >> deploy/.env

          echo ""
          echo "✅ Folder deploy siap:"
          find deploy -maxdepth 2 -type d | head -20
          echo "Total file : $(find deploy -type f | wc -l)"
          echo "Total size : $(du -sh deploy | cut -f1)"
        env:
          DATABASE_URL_VAL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL_VAL: ${{ secrets.DIRECT_URL }}
          AUTH_JWT_SECRET_VAL: ${{ secrets.AUTH_JWT_SECRET }}
          SITE_URL_VAL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://keluhkampus.my.id' }}
          AI_API_KEY_VAL: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL_VAL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL_VAL: ${{ secrets.AI_MODEL }}
          AI_MODEL_FAST_VAL: ${{ secrets.AI_MODEL_FAST }}
          AI_MODEL_REVIEW_VAL: ${{ secrets.AI_MODEL_REVIEW }}

      - name: 📤 Upload via FTP (lftp mirror --delete)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || secrets.CPANEL_HOST || secrets.FTP_HOST || vars.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.CPANEL_USER || secrets.FTP_USER || vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.CPANEL_PASSWORD || vars.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || vars.FTP_SERVER_DIR || '/' }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Kredensial FTP belum diset di GitHub Secrets!"
            exit 1
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📤 Upload ke FTP dengan mirror --delete (sync penuh)..."
          echo "   Server : $FTP_SERVER"
          echo "   Folder : $FTP_SERVER_DIR"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          printf '%s\n' \
            "set ssl:verify-certificate no" \
            "set ftp:ssl-allow no" \
            "set ftp:passive-mode true" \
            "set ftp:use-pret no" \
            "set ftp:prefer-epsv no" \
            "set net:max-retries 5" \
            "set net:timeout 120" \
            "set net:reconnect-interval-base 5" \
            "set net:reconnect-interval-multiplier 1" \
            "set mirror:parallel-transfer-count 10" \
            "set mirror:use-pget-n 5" \
            "open -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" \"${FTP_SERVER}\"" \
            "mirror --reverse --delete --verbose --no-perms --no-umask --exclude-glob=.git/ ./deploy/ \"${FTP_SERVER_DIR}\"" \
            "bye" \
            > /tmp/lftp_deploy.sh

          echo "Script lftp:"
          cat /tmp/lftp_deploy.sh
          echo ""

          lftp -f /tmp/lftp_deploy.sh
          echo ""
          echo "✅ Upload & full sync selesai!"
          echo "   File yang dihapus dari repo → otomatis terhapus dari server (flag --delete)"
          echo "   Phusion Passenger restart → tmp/restart.txt sudah diperbarui"

      - name: 🔔 Deploy Summary
        if: always()
        run: |
          echo "### 🚀 Deployment Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Actor** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Method** | FTP direct mirror + --delete |" >> $GITHUB_STEP_SUMMARY
          echo "| **Startup File** | \`.next/standalone/server.js\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Passenger Restart** | \`tmp/restart.txt\` updated via FTP |" >> $GITHUB_STEP_SUMMARY
          echo "| **File Deletions** | Handled by lftp \`--delete\` flag |" >> $GITHUB_STEP_SUMMARY
