name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-latest
    environment: FTP_SERVER

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🌐 Ambil Info IP Runner GitHub
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org || curl -s https://ifconfig.me)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          echo "=========================================================="
          echo "🌐 IP Runner GitHub Actions saat ini: $RUNNER_IP"
          echo "Command Whitelist di server CSF: csf -a $RUNNER_IP GitHub-Actions"
          echo "=========================================================="
          echo "### 🌐 GitHub Runner IP: \`$RUNNER_IP\`" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 Jika firewall memblokir, jalankan di server: \`csf -a $RUNNER_IP GitHub-Actions\`" >> $GITHUB_STEP_SUMMARY

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🚀 Apply Database Migrations (Opsional)
        if: env.DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          echo "Menjalankan migrasi database jika koneksi tersedia..."
          npx prisma migrate deploy --schema prisma/schema.prisma || echo "::warning::Migrasi dilewati atau gagal terhubung ke database."

      - name: 🏗️ Build Next.js (Standalone Mode)
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://keluhkampus.my.id' }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_MODEL_FAST: ${{ secrets.AI_MODEL_FAST }}
          AI_MODEL_REVIEW: ${{ secrets.AI_MODEL_REVIEW }}
        run: npm run build

      - name: 📁 Prepare Deployment Directory & Archive
        run: |
          echo "Menyiapkan direktori deploy..."
          rm -rf deploy deploy-package
          mkdir -p deploy/.next/standalone/.next
          mkdir -p deploy/tmp

          # 1. Salin seluruh isi .next/standalone ke struktur deploy/.next/standalone
          cp -r .next/standalone/. deploy/.next/standalone/

          # 2. Salin .next/static ke .next/standalone/.next/static (Wajib untuk Next.js standalone)
          cp -r .next/static deploy/.next/standalone/.next/

          # 3. Salin folder public ke .next/standalone/public (Wajib untuk Next.js standalone)
          cp -r public deploy/.next/standalone/

          # 4. Trigger auto-restart cPanel (Phusion Passenger me-restart app jika tmp/restart.txt diubah)
          touch deploy/tmp/restart.txt

          # 5. Salin folder prisma untuk runtime schema
          if [ -d "prisma" ]; then
            cp -r prisma deploy/
          fi

          # 6. Buat file root server.js sebagai startup loader cPanel
          cat << 'EOF' > deploy/server.js
          // Startup file jika cPanel Application Startup File diset ke server.js
          require('./.next/standalone/server.js');
          EOF

          # 7. Generate file .env di server untuk runtime production
          cat << EOF > deploy/.env
          NODE_ENV=production
          PORT=3000
          HOSTNAME=0.0.0.0
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DIRECT_URL=${{ secrets.DIRECT_URL }}
          AUTH_JWT_SECRET=${{ secrets.AUTH_JWT_SECRET }}
          NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://keluhkampus.my.id' }}
          AI_API_KEY=${{ secrets.AI_API_KEY }}
          AI_BASE_URL=${{ secrets.AI_BASE_URL }}
          AI_MODEL=${{ secrets.AI_MODEL }}
          AI_MODEL_FAST=${{ secrets.AI_MODEL_FAST }}
          AI_MODEL_REVIEW=${{ secrets.AI_MODEL_REVIEW }}
          EOF

          # 8. Kompres seluruh isi deploy menjadi 1 file archive tunggal
          echo "Mengompresi folder deploy menjadi deploy.tar.gz..."
          tar -czf deploy.tar.gz -C deploy $(ls -A deploy)
          echo "Ukuran archive:"
          ls -lh deploy.tar.gz

          # 9. Siapkan paket upload (HANYA berisi archive, .htaccess baru, dan script ekstraktor)
          mkdir -p deploy-package
          mv deploy.tar.gz deploy-package/
          cp public/deploy-extract.php deploy-package/
          cp public/.htaccess deploy-package/

          # Inject token rahasia ke dalam script ekstraktor
          DEPLOY_TOKEN="${{ secrets.AUTH_JWT_SECRET || 'kelkam_deploy_secret' }}"
          sed -i "s/DEPLOY_TOKEN_PLACEHOLDER/${DEPLOY_TOKEN}/" deploy-package/deploy-extract.php

          echo "Isi paket yang akan di-upload ke server (sangat ringan):"
          ls -la deploy-package

      - name: 📤 Upload Archive via FTP (Super Cepat)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || secrets.CPANEL_HOST || secrets.FTP_HOST || vars.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.CPANEL_USER || secrets.FTP_USER || vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.CPANEL_PASSWORD || vars.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || vars.FTP_SERVER_DIR || '/' }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Kredensial FTP belum lengkap di GitHub Secrets!"
            exit 1
          fi

          echo "Target Server : $FTP_SERVER"
          echo "Target Folder : $FTP_SERVER_DIR"

          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          {
            echo "set ssl:verify-certificate no"
            echo "set ftp:ssl-allow no"
            echo "set ftp:passive-mode true"
            echo "set ftp:use-pret no"
            echo "set ftp:prefer-epsv no"
            echo "set net:max-retries 3"
            echo "set net:timeout 60"
            echo "open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\""
            echo "mirror --reverse ./deploy-package/ \"$FTP_SERVER_DIR\""
            echo "bye"
          } > /tmp/lftp_script.txt

          echo "Mengunggah archive dan script ekstraktor..."
          lftp -f /tmp/lftp_script.txt
          echo "✅ Upload archive selesai!"

      - name: ⚡ Ekstrak Archive & Restart Server
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://keluhkampus.my.id' }}
          DEPLOY_TOKEN: ${{ secrets.AUTH_JWT_SECRET || 'kelkam_deploy_secret' }}
        run: |
          echo "Memicu ekstraksi otomatis di server cPanel..."
          
          EXTRACT_URL="${SITE_URL}/deploy-extract.php?token=${DEPLOY_TOKEN}"
          FALLBACK_URL="${SITE_URL}/keluhkampus.my.id/deploy-extract.php?token=${DEPLOY_TOKEN}"

          echo "Memanggil: ${SITE_URL}/deploy-extract.php ..."
          HTTP_CODE=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -m 180 "$EXTRACT_URL" || true)
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "URL utama mengembalikan HTTP $HTTP_CODE, mencoba fallback URL..."
            HTTP_CODE=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -m 180 "$FALLBACK_URL" || true)
          fi

          echo "HTTP Status Code: $HTTP_CODE"
          echo "Respon Server:"
          cat /tmp/resp.json 2>/dev/null || true
          echo ""

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Ekstraksi gagal dengan status HTTP $HTTP_CODE. Cek log respons server di atas."
            exit 1
          fi

          echo "✅ Ekstraksi paket berhasil dan Phusion Passenger telah di-restart!"

      - name: 🔔 Deploy Summary
        if: always()
        run: |
          echo "### 🚀 Deployment Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Startup File Target:** \`.next/standalone/server.js\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Passenger Auto-restart:** \`tmp/restart.txt\` updated" >> $GITHUB_STEP_SUMMARY