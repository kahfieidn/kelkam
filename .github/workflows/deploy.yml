name: Deploy to cPanel FTP Fix

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastdigitop-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    environment: FTP_SERVER

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint PHP files
        run: find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: 📂 Sync files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || secrets.CPANEL_HOST || secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME || secrets.CPANEL_USER || secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD || secrets.CPANEL_PASSWORD }}
          port: ${{ secrets.FTP_PORT || secrets.CPANEL_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            .gitignore
            .env.example
            .env
            .DS_Store
            Thumbs.db