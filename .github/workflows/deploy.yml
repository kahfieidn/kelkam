name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy via FTP (tar.gz + Full Sync)
    runs-on: ubuntu-latest
    environment: FTP_SERVER

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🌐 Ambil Info IP Runner GitHub
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org || curl -s https://ifconfig.me)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          echo "=========================================================="
          echo "🌐 IP Runner GitHub Actions saat ini: $RUNNER_IP"
          echo "Command Whitelist di server CSF: csf -a $RUNNER_IP GitHub-Actions"
          echo "=========================================================="
          echo "### 🌐 GitHub Runner IP: \`$RUNNER_IP\`" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 Jika firewall memblokir, jalankan di server: \`csf -a $RUNNER_IP GitHub-Actions\`" >> $GITHUB_STEP_SUMMARY

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🚀 Apply Database Migrations (Opsional)
        if: env.DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          echo "Menjalankan migrasi database jika koneksi tersedia..."
          npx prisma migrate deploy --schema prisma/schema.prisma || echo "::warning::Migrasi dilewati atau gagal terhubung ke database."

      - name: 🏗️ Build Next.js (Standalone Mode)
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://keluhkampus.my.id' }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_MODEL_FAST: ${{ secrets.AI_MODEL_FAST }}
          AI_MODEL_REVIEW: ${{ secrets.AI_MODEL_REVIEW }}
        run: npm run build

      - name: 📁 Prepare Deployment Package (tar.gz)
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Menyiapkan paket deploy (compress → upload → extract)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          rm -rf deploy deploy-package
          mkdir -p deploy/.next/standalone/.next
          mkdir -p deploy/tmp

          # 1. Salin seluruh isi .next/standalone ke struktur deploy
          echo "→ Menyalin .next/standalone..."
          cp -r .next/standalone/. deploy/.next/standalone/

          # 2. Salin .next/static ke .next/standalone/.next/static (wajib untuk standalone)
          echo "→ Menyalin .next/static..."
          cp -r .next/static deploy/.next/standalone/.next/

          # 3. Salin folder public ke .next/standalone/public (wajib untuk standalone)
          echo "→ Menyalin public/..."
          cp -r public deploy/.next/standalone/

          # 4. Touch tmp/restart.txt agar Phusion Passenger restart otomatis
          touch deploy/tmp/restart.txt

          # 5. Salin folder prisma untuk runtime schema
          if [ -d "prisma" ]; then
            echo "→ Menyalin prisma/..."
            cp -r prisma deploy/
          fi

          # 6. Buat file root server.js sebagai startup loader cPanel
          cat << 'EOF' > deploy/server.js
          // Startup file jika cPanel Application Startup File diset ke server.js
          require('./.next/standalone/server.js');
          EOF

          # 7. Generate file .env untuk runtime production
          cat << EOF > deploy/.env
          NODE_ENV=production
          PORT=3000
          HOSTNAME=0.0.0.0
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DIRECT_URL=${{ secrets.DIRECT_URL }}
          AUTH_JWT_SECRET=${{ secrets.AUTH_JWT_SECRET }}
          NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://keluhkampus.my.id' }}
          AI_API_KEY=${{ secrets.AI_API_KEY }}
          AI_BASE_URL=${{ secrets.AI_BASE_URL }}
          AI_MODEL=${{ secrets.AI_MODEL }}
          AI_MODEL_FAST=${{ secrets.AI_MODEL_FAST }}
          AI_MODEL_REVIEW=${{ secrets.AI_MODEL_REVIEW }}
          EOF

          # 8. Buat manifest daftar SEMUA file yang ada di paket deploy
          #    File ini dipakai oleh server untuk menghapus file lama yang sudah tidak ada
          echo "→ Membuat deploy-manifest.txt..."
          find deploy -type f | sed 's|^deploy/||' | sort > deploy/deploy-manifest.txt
          echo "  Total file: $(wc -l < deploy/deploy-manifest.txt)"

          # 9. Kompres seluruh isi deploy menjadi 1 file archive
          echo "→ Mengompresi menjadi deploy.tar.gz..."
          tar -czf deploy.tar.gz -C deploy .
          echo "  Ukuran archive: $(du -sh deploy.tar.gz | cut -f1)"

          # 10. Siapkan paket upload: archive + extractor PHP
          mkdir -p deploy-package
          mv deploy.tar.gz deploy-package/
          cp public/deploy-extract.php deploy-package/

          # Inject token rahasia ke dalam script ekstraktor
          DEPLOY_TOKEN="${{ secrets.AUTH_JWT_SECRET || 'kelkam_deploy_secret' }}"
          sed -i "s/DEPLOY_TOKEN_PLACEHOLDER/${DEPLOY_TOKEN}/" deploy-package/deploy-extract.php

          echo ""
          echo "✅ Isi paket yang akan di-upload:"
          ls -lh deploy-package/

      - name: 📤 Upload Package via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || secrets.CPANEL_HOST || secrets.FTP_HOST || vars.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.CPANEL_USER || secrets.FTP_USER || vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.CPANEL_PASSWORD || vars.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || vars.FTP_SERVER_DIR || '/' }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Kredensial FTP belum diset di GitHub Secrets!"
            echo "  Pastikan secret berikut ada: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD"
            exit 1
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📤 Mengunggah ke FTP..."
          echo "   Server : $FTP_SERVER"
          echo "   Folder : $FTP_SERVER_DIR"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          # Tulis script lftp ke file terpisah agar variabel shell ter-expand dengan benar
          cat > /tmp/lftp_deploy.sh << EOF
set ssl:verify-certificate no
set ftp:ssl-allow no
set ftp:passive-mode true
set ftp:use-pret no
set ftp:prefer-epsv no
set net:max-retries 5
set net:timeout 120
set net:reconnect-interval-base 5
set net:reconnect-interval-multiplier 1
open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
mirror --reverse --verbose --no-perms --no-umask ./deploy-package/ "$FTP_SERVER_DIR"
bye
EOF

          echo "Script lftp yang akan dijalankan:"
          cat /tmp/lftp_deploy.sh
          echo ""

          lftp -f /tmp/lftp_deploy.sh
          echo "✅ Upload selesai!"

      - name: ⚡ Trigger Extract & Restart Server
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://keluhkampus.my.id' }}
          DEPLOY_TOKEN: ${{ secrets.AUTH_JWT_SECRET || 'kelkam_deploy_secret' }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚡ Memicu ekstraksi otomatis di server cPanel..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          EXTRACT_URL="${SITE_URL}/deploy-extract.php?token=${DEPLOY_TOKEN}"

          echo "→ Memanggil: $EXTRACT_URL"
          HTTP_CODE=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            --max-time 300 \
            --retry 2 \
            --retry-delay 10 \
            "$EXTRACT_URL" || true)

          echo ""
          echo "HTTP Status : $HTTP_CODE"
          echo "Respon      :"
          cat /tmp/resp.json 2>/dev/null | python3 -m json.tool 2>/dev/null || cat /tmp/resp.json 2>/dev/null || true
          echo ""

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Ekstraksi gagal dengan HTTP $HTTP_CODE."
            echo "::error::Pastikan deploy-extract.php sudah ter-upload & token sudah benar."
            exit 1
          fi

          echo "✅ Deploy berhasil! Phusion Passenger sudah di-restart."

      - name: 🔔 Deploy Summary
        if: always()
        run: |
          echo "### 🚀 Deployment Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Actor** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Method** | FTP upload tar.gz → server extract |" >> $GITHUB_STEP_SUMMARY
          echo "| **Startup File** | \`.next/standalone/server.js\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Passenger Restart** | \`tmp/restart.txt\` updated |" >> $GITHUB_STEP_SUMMARY
          echo "| **Full Sync** | \`deploy-manifest.txt\` (hapus file lama) |" >> $GITHUB_STEP_SUMMARY